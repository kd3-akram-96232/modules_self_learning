<!DOCTYPE html>
<html>
<head>
    <title>Fetch Async Await</title>
</head>
<body>

<h1>Books Using Async Await</h1>

<button onclick="getBooks()">
    Get Books
</button>

<ul id="books"></ul>

<script>

async function getBooks(){

    try{

        const response = await fetch('http://localhost:3000/books');

        const data = await response.json();

        let output = '';

        data.forEach(book => {

            output += `
                <li>
                    ${book.name} - ${book.author}
                </li>
            `;
        });

        document.getElementById('books').innerHTML = output;

    }
    catch(error){

        console.log(error);
    }

}

</script>

</body>
</html>
